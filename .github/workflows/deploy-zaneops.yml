name: Deploy to ZaneOps

on:
  push:
    branches:
      - master

jobs:
  wait-for-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API tests to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: api-tests
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Wait for Playwright tests to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: playwright-tests
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy:
    needs: wait-for-tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ZaneOps deployment
        run: |
          curl --fail-with-body -X PUT "${{ secrets.ZANEOPS_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"${{ github.sha }}\"}"
